# WebShop stage-two overlay. Start only after the Sokoban five-update GPU smoke passes.
defaults:
  - _6_webshop

model_path: Qwen/Qwen3.5-2B

lora:
  rank: 32
  alpha: 64
  target_modules: all-linear

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true

probe:
  enabled: true
  budget: 2
  lambda_coef: 0.5
  scheduler: linear_ucb
  warmup_updates: 20
  warmup_probes: 200
  exploration_rate: 0.1
  linear_ucb_alpha: 1.0
  state_hash_strict: true

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: true
  rollout:
    temperature: 1.0
    gpu_memory_utilization: 0.65
    max_model_len: 16384
    max_num_batched_tokens: 16384

agent_proxy:
  context_window_mode: full
  max_turn: 9
  max_actions_per_turn: 1

es_manager:
  train:
    env_groups: 4
    group_size: 4
    env_configs:
      tags: ["WebShop"]
      n_groups: [4]
  val:
    env_groups: 64
    group_size: 1
    env_configs:
      tags: ["WebShop"]
      n_groups: [64]

ppo_mini_batch_size: 8

trainer:
  project_name: probegrpo
  experiment_name: qwen3.5-2b-webshop-linear-ucb
  total_training_steps: 200
  validation_steps: 1
  save_freq: 50
  test_freq: 10
  logger: ["console", "wandb"]

