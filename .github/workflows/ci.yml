name: core-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: make check
      - name: Verify committed source in an isolated CPU clone
        run: python scripts/check_clean_cpu.py --mode committed --output-dir outputs/ci-clean-cpu
      - name: Verify pinned framework patch and idempotence
        if: matrix.python-version == '3.12'
        run: |
          bash scripts/setup_verl.sh "$RUNNER_TEMP/verl"
          bash scripts/setup_verl.sh "$RUNNER_TEMP/verl"

